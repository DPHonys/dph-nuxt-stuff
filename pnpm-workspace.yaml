shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  # Nuxt 4.5.1 transitively resolves this historical Babel dependency. It was
  # published before npm provenance was common and is pinned to the exact
  # version that pnpm's trust check flags.
  - semver@6.3.1

packages:
  - scaffolder
  - release/*
  - packages/*
  - packages/*/playground

versioning:
  changelog:
    storage: repository

allowBuilds:
  # pnpm accepts exact versions only here (no ranges), so every new esbuild
  # release the tree resolves to must be appended by hand. The scaffolder's
  # acceptance fixture installs with no lockfile and resolves esbuild fresh,
  # so its test goes red the day a release falls outside this union — that
  # failure means "audit the new version's build script and extend the list".
  esbuild@0.25.12 || 0.28.1 || 0.28.2: true
  unrs-resolver: true

catalog:
  '@clack/prompts': ^1.7.0
  '@nuxt/devtools': ^3.3.1
  '@nuxt/kit': ^4.5.1
  '@nuxt/module-builder': ^1.0.3
  '@nuxt/schema': ^4.5.1
  '@nuxt/test-utils': ^4.1.0
  # Types only — the payload position reads a schema's inferred output and this
  # package never executes one, so nothing of this reaches a runtime bundle.
  '@standard-schema/spec': ^1.1.0
  '@types/node': latest
  citty: ^0.2.2
  # Ranged on purpose, with a major ceiling and no exact pin. The module augments
  # `h3` and reads Nitro's types, and module augmentation binds to a resolved
  # path — range overlap with Nuxt's own transitive copies is what keeps pnpm on
  # a single physical instance. An exact pin causes the duplicate it looks like
  # it prevents. See SPEC.md §7.2.
  h3: ^1.15.11
  magicast: ^0.5.3
  nitropack: ^2.13.4
  nuxt: ^4.5.1
  nypm: ^0.6.9
  pathe: ^2.0.3
  pkg-types: ^2.3.0
  publint: ^0.3.22
  scule: ^1.3.0
  # Stock TypeScript — the compiler every downstream consumer of the emitted
  # `.d.ts` runs, and therefore the one this repo checks with. The caret floats
  # on purpose: a new minor breaking the type suites is a consumer-divergence
  # signal, delivered as a red Renovate PR.
  typescript: ^5.9.3
  vitest: ^4.1.10
  # Ranged with a major ceiling, for the same instance-identity reason as `h3`
  # (SPEC.md §7.2): Vue's reactivity is module-global, so a second physical copy
  # means a `computed` that does not track a ref owned by the first. Range
  # overlap with Nuxt's own `vue` is what keeps pnpm on one directory.
  vue: ^3.5.40
  vue-tsc: ^3.3.8
  yaml: ^2.9.0
  # A real Standard Schema implementation, for the validation surface's tests
  # and playground routes only — the module itself inlines the ~50 spec lines
  # and depends on no validator (SPEC.md §3.3). Ranged with a major ceiling and
  # no pin, per SPEC.md §7.2: the rule is the same one `h3` and `vue` carry,
  # and a schema value crossing from a consumer's code into this module is one
  # more identity that must stay single.
  zod: ^4.4.3
