name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  contract:
    name: Publishing contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm publishing-contract

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `--format=github` emits workflow commands, which surface as inline
      # annotations on the pull request diff.
      - name: Oxlint
        run: pnpm lint:oxlint --format=github
      # setup-node registers the eslint-stylish problem matcher, so the default
      # output is annotated the same way. Runs even when Oxlint fails so both
      # reports land in one round trip.
      - name: ESLint
        if: ${{ !cancelled() }}
        run: pnpm lint:eslint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  knip:
    name: Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # knip resolves the generated `.nuxt/tsconfig.json` files.
      - run: pnpm build
      - run: pnpm knip

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      - name: Report test results
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Vitest
          path: '**/test-results/junit.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results
          path: '**/test-results/junit.xml'
          if-no-files-found: ignore

  build:
    name: Build and publint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm publint
