name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install
      - run: pnpm run check

  pkg-pr-new:
    name: Preview Release
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build
      - run: |
          packages=$(find packages -mindepth 1 -maxdepth 1 -type d 2>/dev/null)
          if [ -n "$packages" ]; then
            pnpm dlx pkg-pr-new publish './packages/*'
          else
            echo "No packages to publish yet, skipping."
          fi
