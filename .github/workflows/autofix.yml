name: autofix.ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    name: Autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install
      - run: pnpm run lint:fix
      - uses: autofix-ci/action@v1
        with:
          commit-message: 'chore: autofix'
